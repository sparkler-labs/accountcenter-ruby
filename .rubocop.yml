AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "pkg/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Max: 20

Metrics/ClassLength:
  Max: 150

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

Metrics/ParameterLists:
  Max: 5
  CountKeywordArgs: false

Metrics/AbcSize:
  Max: 25

# Dev dependencies live in the gemspec by design (published-gem convention).
Gemspec/DevelopmentDependencies:
  Enabled: false
